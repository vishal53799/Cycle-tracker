<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Menstrual Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Smooth UI Animations */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .tab-btn { transition: all 0.2s ease-in-out; }
        .tab-btn.active { border-top: 3px solid #a855f7; color: #a855f7; font-weight: bold; background-color: #faf5ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .day-cell { min-height: 60px; transition: all 0.2s; }
        .day-cell:hover { transform: scale(1.05); cursor: default; }
        
        /* Symptom Chip Styles */
        .symptom-chip { transition: all 0.2s ease; }
        .symptom-chip.selected {
            background-color: #a855f7; /* purple-500 */
            color: white;
            border-color: #a855f7;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body class="bg-pink-50 text-purple-900 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 text-center sticky top-0 z-10 transition-all">
        <h1 class="text-2xl font-bold text-purple-600 tracking-wide"><i class="fas fa-leaf mr-2 text-teal-400"></i>Aura</h1>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow p-4 max-w-md mx-auto w-full mb-16 overflow-hidden">
        
        <!-- CALENDAR TAB -->
        <div id="tab-calendar" class="tab-content active animate-fade">
            <div class="bg-white rounded-2xl shadow-sm p-4 mb-4 transition-all">
                <div class="flex justify-between items-center mb-4">
                    <button id="prevMonth" class="p-2 text-purple-500 hover:bg-pink-100 active:scale-90 rounded-full transition-all w-10 h-10 flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="monthYearDisplay" class="font-bold text-lg tracking-wide"></h2>
                    <button id="nextMonth" class="p-2 text-purple-500 hover:bg-pink-100 active:scale-90 rounded-full transition-all w-10 h-10 flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
                </div>
                <!-- Weekdays -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400 mb-2 tracking-wider">
                    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                </div>
                <!-- Calendar Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>

            <!-- Legend -->
            <div class="bg-white rounded-2xl shadow-sm p-4 text-xs space-y-3">
                <div class="flex items-center"><div class="w-4 h-4 bg-pink-400 rounded-md mr-3 shadow-sm"></div> <span class="font-medium text-gray-600">Logged Period</span></div>
                <div class="flex items-center"><div class="w-4 h-4 border-2 border-dashed border-purple-400 rounded-md mr-3"></div> <span class="font-medium text-gray-600">Predicted Period</span></div>
                <div class="flex items-center"><div class="w-4 h-4 bg-teal-100 rounded-md mr-3 shadow-sm"></div> <span class="font-medium text-gray-600">Fertile Window</span></div>
                <div class="flex items-center"><div class="w-4 h-4 border-2 border-teal-500 bg-teal-200 rounded-md mr-3 shadow-sm"></div> <span class="font-medium text-gray-600">Ovulation Day</span></div>
            </div>
        </div>

        <!-- HISTORY TAB -->
        <div id="tab-history" class="tab-content animate-fade">
            <form id="cycleForm" class="bg-white p-5 rounded-2xl shadow-sm mb-6">
                <h3 class="font-bold text-lg mb-4 text-purple-600 flex items-center"><i class="fas fa-plus-circle mr-2 text-pink-400"></i>Log a Cycle</h3>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1 font-bold">First Day of Period</label>
                    <input type="date" id="startDate" class="w-full border-2 border-pink-100 rounded-xl p-3 focus:outline-none focus:border-purple-400 transition-all bg-gray-50" required>
                </div>
                <div class="mb-5">
                    <label class="block text-sm text-gray-600 mb-1 font-bold">How many days did it last?</label>
                    <input type="number" id="duration" class="w-full border-2 border-pink-100 rounded-xl p-3 focus:outline-none focus:border-purple-400 transition-all bg-gray-50" min="1" max="15" placeholder="e.g. 5" required>
                </div>
                
                <!-- NEW: Interactive Symptoms -->
                <div class="mb-6">
                    <label class="block text-sm text-gray-600 mb-2 font-bold">Symptoms (tap to select)</label>
                    <div id="symptomContainer" class="flex flex-wrap gap-2">
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Bloating</button>
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Mood swings</button>
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Heavy flow</button>
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Low flow</button>
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Black - colour</button>
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Red - colour</button>
                        <button type="button" class="symptom-chip border border-pink-200 text-pink-700 bg-pink-50 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-pink-100 focus:outline-none">Too much pain</button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-purple-500 text-white rounded-xl p-3.5 font-bold hover:bg-purple-600 active:scale-95 transition-all shadow-md flex justify-center items-center">
                    <i class="fas fa-save mr-2"></i> Save Cycle
                </button>
            </form>
            
            <h3 class="font-bold text-lg mb-3 text-purple-600 ml-1">Past Cycles</h3>
            <div id="historyList" class="space-y-4">
                <!-- History Cards inject here -->
            </div>
        </div>

        <!-- INSIGHTS TAB -->
        <div id="tab-insights" class="tab-content animate-fade">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm text-center transform hover:-translate-y-1 transition-all duration-300">
                    <div class="text-3xl font-bold text-pink-400" id="avgCycleLength">--</div>
                    <div class="text-xs text-gray-500 font-bold mt-2 tracking-wide">AVG CYCLE (DAYS)</div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm text-center transform hover:-translate-y-1 transition-all duration-300">
                    <div class="text-3xl font-bold text-purple-400" id="avgPeriodLength">--</div>
                    <div class="text-xs text-gray-500 font-bold mt-2 tracking-wide">AVG PERIOD (DAYS)</div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 text-center border-t-4 border-teal-400 transform hover:shadow-md transition-all duration-300">
                <div class="bg-teal-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-seedling text-teal-500 text-3xl"></i>
                </div>
                <h3 class="font-bold text-gray-700 text-lg">Next Ovulation Peak</h3>
                <div id="insightOvulation" class="text-xl font-bold text-teal-600 mt-1 mb-3">--</div>
                <div class="text-sm text-gray-500 bg-gray-50 rounded-lg py-2 px-4 inline-block">Fertile Window: <span id="insightFertile" class="font-bold text-gray-700">--</span></div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm">
                <h3 class="font-bold text-xs text-gray-400 mb-4 tracking-wider">CYCLE LENGTH HISTORY</h3>
                <canvas id="cycleChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white shadow-[0_-10px_30px_rgba(0,0,0,0.08)] fixed bottom-0 w-full max-w-md mx-auto left-0 right-0 flex justify-around z-20 text-xs pb-safe">
        <button class="tab-btn active flex flex-col items-center p-3 w-full text-gray-400" data-target="tab-calendar">
            <i class="far fa-calendar-alt text-xl mb-1"></i> Calendar
        </button>
        <button class="tab-btn flex flex-col items-center p-3 w-full text-gray-400" data-target="tab-history">
            <i class="fas fa-history text-xl mb-1"></i> History
        </button>
        <button class="tab-btn flex flex-col items-center p-3 w-full text-gray-400" data-target="tab-insights">
            <i class="far fa-chart-bar text-xl mb-1"></i> Insights
        </button>
    </nav>

    <script>
        // Data State
        let cycles = JSON.parse(localStorage.getItem('aura_cycles')) || [];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let chartInstance = null;
        let selectedSymptoms = []; // Array to hold tapped symptoms

        // Helpers
        const addDays = (date, days) => { let d = new Date(date); d.setDate(d.getDate() + days); return d; }
        const diffDays = (d1, d2) => Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        const formatDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        // Navigation with Animation reset
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'text-purple-600'));
                document.querySelectorAll('.tab-content').forEach(c => {
                    c.classList.remove('active');
                    // Reset animation state
                    c.style.animation = 'none';
                    c.offsetHeight; // trigger reflow
                    c.style.animation = null; 
                });
                
                btn.classList.add('active', 'text-purple-600');
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        // Symptom Chip Selection Logic
        document.querySelectorAll('.symptom-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const symptomName = chip.innerText;
                if (selectedSymptoms.includes(symptomName)) {
                    // Remove if already selected
                    selectedSymptoms = selectedSymptoms.filter(s => s !== symptomName);
                    chip.classList.remove('selected', 'bg-purple-500', 'text-white');
                    chip.classList.add('text-pink-700', 'bg-pink-50');
                } else {
                    // Add symptom
                    selectedSymptoms.push(symptomName);
                    chip.classList.add('selected', 'bg-purple-500', 'text-white');
                    chip.classList.remove('text-pink-700', 'bg-pink-50');
                }
            });
        });

        // App Logic
        function saveData() {
            localStorage.setItem('aura_cycles', JSON.stringify(cycles));
            updateUI();
        }

        function getPredictions() {
            if (cycles.length === 0) return null;
            
            let sorted = [...cycles].sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
            let totalCycleDays = 0;
            let totalPeriodDays = 0;
            let cycleCount = 0;

            for (let i = 0; i < sorted.length; i++) {
                totalPeriodDays += parseInt(sorted[i].duration);
                if (i < sorted.length - 1) {
                    totalCycleDays += diffDays(new Date(sorted[i].startDate), new Date(sorted[i+1].startDate));
                    cycleCount++;
                }
            }

            let avgCycle = cycleCount > 0 ? Math.round(totalCycleDays / cycleCount) : 28;
            let avgPeriod = Math.round(totalPeriodDays / sorted.length);
            
            let lastCycle = sorted[sorted.length - 1];
            let nextPeriodStart = addDays(lastCycle.startDate, avgCycle);
            let nextPeriodEnd = addDays(nextPeriodStart, avgPeriod - 1);
            
            let ovulationDay = addDays(nextPeriodStart, -14);
            let fertileStart = addDays(ovulationDay, -5);
            let fertileEnd = addDays(ovulationDay, 1);

            return { avgCycle, avgPeriod, nextPeriodStart, nextPeriodEnd, ovulationDay, fertileStart, fertileEnd, sorted };
        }

        // Calendar Render
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            document.getElementById('monthYearDisplay').innerText = new Date(currentYear, currentMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const preds = getPredictions();

            // Blanks
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="day-cell"></div>`;
            }

            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                let currentCellDate = new Date(currentYear, currentMonth, day);
                currentCellDate.setHours(0,0,0,0);
                
                let isLoggedPeriod = false;
                let isPredictedPeriod = false;
                let isFertile = false;
                let isOvulation = false;

                // Check actual logged periods
                cycles.forEach(c => {
                    let start = new Date(c.startDate);
                    start.setHours(0,0,0,0);
                    let end = addDays(start, c.duration - 1);
                    end.setHours(0,0,0,0);
                    if (currentCellDate >= start && currentCellDate <= end) isLoggedPeriod = true;
                });

                // Check predictions
                if (preds && !isLoggedPeriod) {
                    let pStart = preds.nextPeriodStart; pStart.setHours(0,0,0,0);
                    let pEnd = preds.nextPeriodEnd; pEnd.setHours(0,0,0,0);
                    let oDay = preds.ovulation
