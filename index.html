<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Menstrual Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-btn.active { border-bottom: 2px solid #a855f7; color: #a855f7; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .day-cell { min-height: 60px; }
    </style>
</head>
<body class="bg-pink-50 text-purple-900 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 text-center sticky top-0 z-10">
        <h1 class="text-2xl font-bold text-purple-600"><i class="fas fa-leaf mr-2 text-teal-400"></i>Aura</h1>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow p-4 max-w-md mx-auto w-full mb-16">
        
        <!-- CALENDAR TAB -->
        <div id="tab-calendar" class="tab-content active">
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
                <div class="flex justify-between items-center mb-4">
                    <button id="prevMonth" class="p-2 text-purple-500 hover:bg-pink-50 rounded"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="monthYearDisplay" class="font-bold text-lg"></h2>
                    <button id="nextMonth" class="p-2 text-purple-500 hover:bg-pink-50 rounded"><i class="fas fa-chevron-right"></i></button>
                </div>
                <!-- Weekdays -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400 mb-2">
                    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                </div>
                <!-- Calendar Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>

            <!-- Legend -->
            <div class="bg-white rounded-xl shadow-sm p-4 text-xs space-y-2">
                <div class="flex items-center"><div class="w-4 h-4 bg-pink-300 rounded mr-2"></div> Logged Period</div>
                <div class="flex items-center"><div class="w-4 h-4 border-2 border-dashed border-purple-400 rounded mr-2"></div> Predicted Period</div>
                <div class="flex items-center"><div class="w-4 h-4 bg-teal-100 rounded mr-2"></div> Fertile Window</div>
                <div class="flex items-center"><div class="w-4 h-4 border-2 border-teal-500 bg-teal-200 rounded mr-2"></div> Ovulation Day</div>
            </div>
        </div>

        <!-- HISTORY TAB -->
        <div id="tab-history" class="tab-content">
            <form id="cycleForm" class="bg-white p-4 rounded-xl shadow-sm mb-6">
                <h3 class="font-bold text-lg mb-4 text-purple-600">Log a Cycle</h3>
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1 font-bold">First Day of Period</label>
                    <input type="date" id="startDate" class="w-full border border-pink-200 rounded p-2 focus:outline-none focus:border-purple-400" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1 font-bold">How many days did it last?</label>
                    <input type="number" id="duration" class="w-full border border-pink-200 rounded p-2 focus:outline-none focus:border-purple-400" min="1" max="15" placeholder="e.g. 5" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1 font-bold">Symptoms (optional)</label>
                    <input type="text" id="symptoms" class="w-full border border-pink-200 rounded p-2 focus:outline-none focus:border-purple-400" placeholder="Cramps, fatigue, bloating...">
                </div>
                <button type="submit" class="w-full bg-purple-500 text-white rounded-lg p-3 font-bold hover:bg-purple-600 transition shadow-md">Save Cycle</button>
            </form>
            
            <h3 class="font-bold text-lg mb-3 text-purple-600">Past Cycles</h3>
            <div id="historyList" class="space-y-3">
                <!-- History Cards inject here -->
            </div>
        </div>

        <!-- INSIGHTS TAB -->
        <div id="tab-insights" class="tab-content">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm text-center">
                    <div class="text-3xl font-bold text-pink-400" id="avgCycleLength">--</div>
                    <div class="text-xs text-gray-500 font-bold mt-1">AVG CYCLE (DAYS)</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm text-center">
                    <div class="text-3xl font-bold text-pink-400" id="avgPeriodLength">--</div>
                    <div class="text-xs text-gray-500 font-bold mt-1">AVG PERIOD (DAYS)</div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm mb-6 text-center border-t-4 border-teal-400">
                <i class="fas fa-seedling text-teal-400 text-3xl mb-2"></i>
                <h3 class="font-bold text-gray-700">Next Ovulation Peak</h3>
                <div id="insightOvulation" class="text-lg font-bold text-teal-600 mt-1">--</div>
                <div class="text-xs text-gray-500 mt-2">Fertile Window: <span id="insightFertile">--</span></div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h3 class="font-bold text-sm text-gray-500 mb-4">CYCLE LENGTH HISTORY</h3>
                <canvas id="cycleChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.05)] fixed bottom-0 w-full max-w-md mx-auto left-0 right-0 flex justify-around p-3 z-10 text-xs">
        <button class="tab-btn active flex flex-col items-center p-2 w-full text-gray-400" data-target="tab-calendar">
            <i class="far fa-calendar-alt text-xl mb-1"></i> Calendar
        </button>
        <button class="tab-btn flex flex-col items-center p-2 w-full text-gray-400" data-target="tab-history">
            <i class="fas fa-history text-xl mb-1"></i> History
        </button>
        <button class="tab-btn flex flex-col items-center p-2 w-full text-gray-400" data-target="tab-insights">
            <i class="far fa-chart-bar text-xl mb-1"></i> Insights
        </button>
    </nav>

    <script>
        // Data State
        let cycles = JSON.parse(localStorage.getItem('aura_cycles')) || [];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let chartInstance = null;

        // Helpers
        const addDays = (date, days) => { let d = new Date(date); d.setDate(d.getDate() + days); return d; }
        const diffDays = (d1, d2) => Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        const formatDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        // Navigation
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'text-purple-600'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active', 'text-purple-600');
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        // App Logic
        function saveData() {
            localStorage.setItem('aura_cycles', JSON.stringify(cycles));
            updateUI();
        }

        function getPredictions() {
            if (cycles.length === 0) return null;
            
            let sorted = [...cycles].sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
            let totalCycleDays = 0;
            let totalPeriodDays = 0;
            let cycleCount = 0;

            for (let i = 0; i < sorted.length; i++) {
                totalPeriodDays += parseInt(sorted[i].duration);
                if (i < sorted.length - 1) {
                    totalCycleDays += diffDays(new Date(sorted[i].startDate), new Date(sorted[i+1].startDate));
                    cycleCount++;
                }
            }

            let avgCycle = cycleCount > 0 ? Math.round(totalCycleDays / cycleCount) : 28;
            let avgPeriod = Math.round(totalPeriodDays / sorted.length);
            
            let lastCycle = sorted[sorted.length - 1];
            let nextPeriodStart = addDays(lastCycle.startDate, avgCycle);
            let nextPeriodEnd = addDays(nextPeriodStart, avgPeriod - 1);
            
            let ovulationDay = addDays(nextPeriodStart, -14);
            let fertileStart = addDays(ovulationDay, -5);
            let fertileEnd = addDays(ovulationDay, 1);

            return { avgCycle, avgPeriod, nextPeriodStart, nextPeriodEnd, ovulationDay, fertileStart, fertileEnd, sorted };
        }

        // Calendar Render
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            document.getElementById('monthYearDisplay').innerText = new Date(currentYear, currentMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const preds = getPredictions();

            // Blanks
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="day-cell"></div>`;
            }

            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                let currentCellDate = new Date(currentYear, currentMonth, day);
                currentCellDate.setHours(0,0,0,0);
                
                let isLoggedPeriod = false;
                let isPredictedPeriod = false;
                let isFertile = false;
                let isOvulation = false;

                // Check actual logged periods
                cycles.forEach(c => {
                    let start = new Date(c.startDate);
                    start.setHours(0,0,0,0);
                    let end = addDays(start, c.duration - 1);
                    end.setHours(0,0,0,0);
                    if (currentCellDate >= start && currentCellDate <= end) isLoggedPeriod = true;
                });

                // Check predictions
                if (preds && !isLoggedPeriod) {
                    let pStart = preds.nextPeriodStart; pStart.setHours(0,0,0,0);
                    let pEnd = preds.nextPeriodEnd; pEnd.setHours(0,0,0,0);
                    let oDay = preds.ovulationDay; oDay.setHours(0,0,0,0);
                    let fStart = preds.fertileStart; fStart.setHours(0,0,0,0);
                    let fEnd = preds.fertileEnd; fEnd.setHours(0,0,0,0);

                    if (currentCellDate >= pStart && currentCellDate <= pEnd) isPredictedPeriod = true;
                    if (currentCellDate.getTime() === oDay.getTime()) isOvulation = true;
                    else if (currentCellDate >= fStart && currentCellDate <= fEnd) isFertile = true;
                }

                let classes = "day-cell flex items-center justify-center rounded-lg text-sm m-0.5 ";
                
                if (isLoggedPeriod) classes += "bg-pink-300 text-white font-bold ";
                else if (isPredictedPeriod) classes += "border-2 border-dashed border-purple-400 text-purple-700 ";
                else if (isOvulation) classes += "border-2 border-teal-500 bg-teal-200 text-teal-800 font-bold ";
                else if (isFertile) classes += "bg-teal-100 text-teal-700 ";
                else classes += "bg-gray-50 text-gray-700 ";

                // Today outline
                let today = new Date();
                if(day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    classes += " ring-2 ring-purple-600 ring-offset-1";
                }

                grid.innerHTML += `<div class="${classes}">${day}</div>`;
            }
        }

        // Calendar Controls
        document.getElementById('prevMonth').onclick = () => { currentMonth--; if(currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); };
        document.getElementById('nextMonth').onclick = () => { currentMonth++; if(currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); };

        // Form Submit
        document.getElementById('cycleForm').onsubmit = (e) => {
            e.preventDefault();
            const newCycle = {
                id: Date.now(),
                startDate: document.getElementById('startDate').value,
                duration: parseInt(document.getElementById('duration').value),
                symptoms: document.getElementById('symptoms').value
            };
            cycles.push(newCycle);
            document.getElementById('cycleForm').reset();
            saveData();
            
            // Switch to calendar to see it
            document.querySelector('[data-target="tab-calendar"]').click();
            let d = new Date(newCycle.startDate);
            currentMonth = d.getMonth();
            currentYear = d.getFullYear();
            renderCalendar();
        };

        // History Render and Delete
        window.deleteCycle = function(id, event) {
            event.stopPropagation();
            if(confirm("Are you sure you want to delete this cycle?")) {
                cycles = cycles.filter(c => c.id !== id);
                saveData();
            }
        };

        window.jumpToDate = function(dateStr) {
            let d = new Date(dateStr);
            currentMonth = d.getMonth();
            currentYear = d.getFullYear();
            document.querySelector('[data-target="tab-calendar"]').click();
            renderCalendar();
        };

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            if(cycles.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">No cycles logged yet.</p>';
                return;
            }

            let sorted = [...cycles].sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
            
            sorted.forEach(c => {
                let d = new Date(c.startDate);
                let html = `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-pink-300 flex justify-between items-center cursor-pointer hover:shadow-md transition" onclick="jumpToDate('${c.startDate}')">
                    <div>
                        <div class="font-bold text-purple-700">${formatDate(d)}, ${d.getFullYear()}</div>
                        <div class="text-sm text-gray-600 mt-1">Period lasted <span class="font-bold">${c.duration} days</span></div>
                        ${c.symptoms ? `<div class="text-xs text-gray-500 mt-1 italic"><i class="fas fa-notes-medical mr-1"></i>${c.symptoms}</div>` : ''}
                    </div>
                    <button onclick="deleteCycle(${c.id}, event)" class="text-gray-300 hover:text-red-500 p-2 text-xl transition bg-gray-50 rounded-full h-10 w-10 flex items-center justify-center">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>`;
                list.innerHTML += html;
            });
        }

        // Insights Render
        function renderInsights() {
            const preds = getPredictions();
            if (!preds) {
                document.getElementById('avgCycleLength').innerText = "--";
                document.getElementById('avgPeriodLength').innerText = "--";
                document.getElementById('insightOvulation').innerText = "--";
                document.getElementById('insightFertile').innerText = "--";
                return;
            }

            document.getElementById('avgCycleLength').innerText = preds.avgCycle;
            document.getElementById('avgPeriodLength').innerText = preds.avgPeriod;
            document.getElementById('insightOvulation').innerText = formatDate(preds.ovulationDay);
            document.getElementById('insightFertile').innerText = `${formatDate(preds.fertileStart)} - ${formatDate(preds.fertileEnd)}`;

            // Chart
            const ctx = document.getElementById('cycleChart').getContext('2d');
            let labels = [];
            let data = [];
            
            for (let i = 0; i < preds.sorted.length - 1; i++) {
                labels.push(formatDate(new Date(preds.sorted[i].startDate)));
                data.push(diffDays(new Date(preds.sorted[i].startDate), new Date(preds.sorted[i+1].startDate)));
            }

            if (chartInstance) chartInstance.destroy();
            
            if (data.length > 0) {
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Cycle Length (Days)',
                            data: data,
                            borderColor: '#a855f7',
                            backgroundColor: 'rgba(168, 85, 247, 0.1)',
                            tension: 0.3,
                            fill: true,
                            pointBackgroundColor: '#ec4899'
                        }]
                    },
                    options: { responsive: true, scales: { y: { beginAtZero: false, suggestedMin: 20, suggestedMax: 35 } } }
                });
            }
        }

        // Master Update
        function updateUI() {
            renderCalendar();
            renderHistory();
            renderInsights();
        }

        // Init
        document.querySelector('[data-target="tab-calendar"]').classList.add('text-purple-600');
        updateUI();
    </script>
</body>
</html>
